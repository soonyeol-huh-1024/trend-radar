<!-- 셀러KIM 제호. 한글은 자모를, 라틴은 획을 기하 도형으로 그린 레터링.
     'KIM'의 I 는 본문 빈자리 게이지 네 칸과 같은 형태. 색은 currentColor 로 상속. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 760 192">
<g fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="butt" stroke-linejoin="miter">
  <!-- 셀 -->
  <path d="M14,96 L48,20 L82,96"/>
  <path d="M152,16 V96"/><path d="M126,58 H152"/><path d="M200,16 V96"/>
  <path d="M14,112 H200 V148 H14 V184 H200"/>
  <!-- 러 -->
  <g transform="translate(224,0)">
    <path d="M16,28 H126 V92 H16 V156 H126"/>
    <path d="M192,16 V184"/><path d="M148,100 H192"/>
  </g>
  <!-- K — 한글에서 라틴으로 넘어가는 자리라 간격을 넓게 뒀다 -->
  <path d="M490,16 V184"/>
  <path d="M496,100 L562,16"/>
  <path d="M496,100 L566,184"/>
  <!-- M -->
  <path d="M652,184 V16 L700,112 L748,16 V184"/>
</g>
<!-- I = 빈자리 게이지 네 칸 -->
<g fill="currentColor">
  <rect x="606" y="16" width="13" height="36" rx="1.5"/>
  <rect x="606" y="60" width="13" height="36" rx="1.5"/>
  <rect x="606" y="104" width="13" height="36" rx="1.5"/>
  <rect x="606" y="148" width="13" height="36" rx="1.5"/>
</g>
</svg>

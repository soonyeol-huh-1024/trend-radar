  <g transform="translate(224,0)">
    <path d="M16,28 H126 V92 H16 V156 H126"/>
    <path d="M192,16 V184"/><path d="M148,100 H192"/>
  </g>
  <!-- 킴 -->
  <g transform="translate(452,0)">
    <path d="M16,30 H116 V96"/><path d="M58,63 H116"/>
    <path d="M16,112 H142 V184 H16 Z"/>
  </g>
</g>
<g fill="currentColor" transform="translate(452,0)">
  <rect x="182" y="16" width="13" height="36" rx="1.5"/>
  <rect x="182" y="60" width="13" height="36" rx="1.5"/>
  <rect x="182" y="104" width="13" height="36" rx="1.5"/>
  <rect x="182" y="148" width="13" height="36" rx="1.5"/>
</g>
</svg>
